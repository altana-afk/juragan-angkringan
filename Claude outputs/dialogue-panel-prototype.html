<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototipe Panel Dialog — Juragan Angkringan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    --panel-bg: #2b2140;
    --panel-edge: #efe6f7;
    --panel-shade: #17112a;
    --name-color: #6ff0ff;
    --text-color: #f4f1fa;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d0a18; font-family: "VT323", "Courier New", monospace;
    -webkit-user-select: none; user-select: none;
  }

  /* ---- latar belakang mock game (hanya untuk konteks) ---- */
  .scene {
    position: fixed; inset: 0;
    background:
      linear-gradient(180deg, #14203a 0%, #2a2a4a 45%, #3b2d3f 60%, #5a3c3a 100%);
  }
  .scene .road {
    position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
    background: repeating-linear-gradient(90deg, #6b4a3c 0 48px, #5e4033 48px 96px);
    opacity: .9;
  }
  .scene .stall {
    position: absolute; left: 12%; bottom: 40%; width: 180px; height: 110px;
    background: #7a3e2f; border: 4px solid #2a1812;
  }
  .scene .stall::before {
    content: ""; position: absolute; top: -26px; left: -10px; right: -10px; height: 30px;
    background: repeating-linear-gradient(90deg, #d9534f 0 20px, #f7f1e3 20px 40px);
  }
  .scene .lamp {
    position: absolute; right: 14%; top: 18%; width: 14px; height: 14px;
    background: #ffd166; box-shadow: 0 0 40px 18px rgba(255, 209, 102, .35);
  }

  /* ---- panel dialog ---- */
  .dialog {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(94vw, 760px);
    min-height: 150px;
    display: grid; grid-template-columns: 124px 1fr; gap: 14px;
    padding: 14px;
    background: var(--panel-bg);
    border: 4px solid var(--panel-edge);
    box-shadow:
      inset 0 0 0 4px var(--panel-shade),
      0 0 0 4px var(--panel-shade),
      0 10px 0 4px rgba(0, 0, 0, .35);
    image-rendering: pixelated;
    cursor: pointer;
    transition: opacity .2s, transform .2s;
  }
  .dialog.hidden { opacity: 0; transform: translate(-50%, 24px); pointer-events: none; }

  .portrait {
    width: 124px; height: 124px;
    background: #1b1530;
    border: 4px solid var(--panel-edge);
    box-shadow: inset 0 0 0 3px var(--panel-shade);
    display: flex; align-items: center; justify-content: center;
  }
  .portrait canvas { width: 112px; height: 88px; image-rendering: pixelated; }

  .content { display: flex; flex-direction: column; min-width: 0; }
  .name {
    position: absolute; top: -18px; left: 150px;
    background: var(--panel-bg);
    border: 4px solid var(--panel-edge);
    box-shadow: inset 0 0 0 3px var(--panel-shade);
    color: var(--name-color);
    font-size: 26px; line-height: 1; padding: 4px 12px 2px;
    letter-spacing: 1px;
  }
  .text {
    flex: 1; margin-top: 8px;
    color: var(--text-color);
    font-size: 30px; line-height: 1.15;
    min-height: 3.4em;
    white-space: pre-wrap; word-break: break-word;
    text-shadow: 2px 2px 0 var(--panel-shade);
  }
  .text .hl { color: var(--name-color); }
  .caret {
    align-self: flex-end; color: var(--accent); font-size: 24px;
    visibility: hidden; animation: blink .8s steps(2, start) infinite;
  }
  .caret.show { visibility: visible; }
  @keyframes blink { to { visibility: hidden; } }

  .hint {
    position: fixed; top: 14px; left: 0; right: 0; text-align: center;
    color: #cfc6e6; font-size: 22px; opacity: .85;
  }
  .controls {
    position: fixed; top: 46px; left: 0; right: 0; text-align: center;
  }
  .controls button {
    font: inherit; font-size: 22px; color: var(--text-color);
    background: var(--panel-bg); border: 3px solid var(--panel-edge);
    box-shadow: inset 0 0 0 2px var(--panel-shade);
    padding: 4px 14px; margin: 0 6px; cursor: pointer;
  }
  .controls button:active { transform: translateY(2px); }

  @media (max-width: 560px) {
    .dialog { grid-template-columns: 84px 1fr; gap: 10px; padding: 10px; bottom: 10px; min-height: 130px; }
    .portrait { width: 84px; height: 84px; }
    .portrait canvas { width: 70px; height: 56px; }
    .name { left: 100px; font-size: 22px; }
    .text { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="stall"></div>
  <div class="lamp"></div>
  <div class="road"></div>
</div>

<div class="hint">Ketuk panel untuk lanjut · ketuk lagi untuk melewati ketikan</div>
<div class="controls">
  <button id="btnShow">Tampilkan dialog</button>
  <button id="btnReset">Ulang</button>
</div>

<section class="dialog" id="dialog" role="dialog" aria-live="polite" aria-label="Dialog pelanggan">
  <div class="portrait"><canvas id="portraitCanvas" width="14" height="11"></canvas></div>
  <div class="content">
    <div class="name" id="speakerName">Bu Surti</div>
    <div class="text" id="lineText"></div>
    <div class="caret" id="caret">▼</div>
  </div>
</section>

<script>
// ---------- Potret pixel (placeholder, bisa diganti sprite asli) ----------
const PALETTE = {
  o: '#0f0b1a', // outline
  S: '#4fb3a6', // kulit
  w: '#eaf6ff', // mata putih
  p: '#1b1530', // pupil
  r: '#ff7a3d', // mulut
  m: '#2e5c6e', // bayangan
  '.': null,
};
const PORTRAIT = [
  '....oooooo....',
  '..ooSSSSSSoo..',
  '.oSSSSSSSSSSo.',
  '.oSwwSSSSwwSo.',
  '.oSwpSSSSwpSo.',
  '.oSSSSSSSSSSo.',
  '.oSSmmmmmmSSo.',
  '.oSSmrrrrmSSo.',
  '..oSSmrrmSSo..',
  '..ooSSSSSSoo..',
  '....oooooo....',
];
(function drawPortrait() {
  const c = document.getElementById('portraitCanvas');
  const ctx = c.getContext('2d');
  PORTRAIT.forEach((row, y) => [...row].forEach((ch, x) => {
    const col = PALETTE[ch];
    if (!col) return;
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 1, 1);
  }));
})();

// ---------- Sistem dialog sederhana ----------
// Setiap entri: { speaker, lines: [...] }. Teks diketik per huruf.
const SCRIPT = [
  { speaker: 'Bu Surti', lines: [
    'Kamu dengar belum? Gerobak Mbah Kardi mau *digusur* bulan depan.',
    'Padahal teh tarik di sana paling enak se-kampung, lho.',
  ]},
];
const CHAR_DELAY_MS = 28;

const dialog = document.getElementById('dialog');
const nameEl = document.getElementById('speakerName');
const textEl = document.getElementById('lineText');
const caret = document.getElementById('caret');

let queue = [];       // daftar baris yang akan ditampilkan
let typing = false;
let timer = null;
let fullText = '';
let shown = 0;

// Format sederhana: *kata* jadi warna sorot.
function renderHighlighted(raw, count) {
  const parts = raw.split(/(\*[^*]+\*)/g);
  let remaining = count;
  let html = '';
  for (const part of parts) {
    const isHl = part.startsWith('*') && part.endsWith('*') && part.length > 2;
    const plain = isHl ? part.slice(1, -1) : part;
    const take = Math.max(0, Math.min(plain.length, remaining));
    remaining -= take;
    if (take === 0) continue;
    const slice = plain.slice(0, take).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    html += isHl ? `<span class="hl">${slice}</span>` : slice;
  }
  return html;
}

function plainLength(raw) { return raw.replace(/\*/g, '').length; }

function startLine(line) {
  fullText = line;
  shown = 0;
  typing = true;
  caret.classList.remove('show');
  tick();
}

function tick() {
  const total = plainLength(fullText);
  shown++;
  textEl.innerHTML = renderHighlighted(fullText, shown);
  if (shown < total) {
    timer = setTimeout(tick, CHAR_DELAY_MS);
  } else {
    finishLine();
  }
}

function finishLine() {
  clearTimeout(timer);
  typing = false;
  textEl.innerHTML = renderHighlighted(fullText, plainLength(fullText));
  caret.classList.add('show');
}

function advance() {
  if (typing) { finishLine(); return; }        // ketuk saat mengetik -> langsung penuh
  if (queue.length > 0) { startLine(queue.shift()); return; }
  hide();
}

function show(entry) {
  nameEl.textContent = entry.speaker;
  queue = [...entry.lines];
  dialog.classList.remove('hidden');
  advance();
}

function hide() {
  dialog.classList.add('hidden');
  caret.classList.remove('show');
}

dialog.addEventListener('click', advance);
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advance(); }
});
document.getElementById('btnShow').addEventListener('click', () => show(SCRIPT[0]));
document.getElementById('btnReset').addEventListener('click', () => {
  clearTimeout(timer); typing = false; queue = []; textEl.innerHTML = ''; hide();
});

// Tampilkan otomatis saat halaman dibuka supaya langsung terlihat.
show(SCRIPT[0]);
</script>
</body>
</html>
